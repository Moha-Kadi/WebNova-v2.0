<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>Contacto | WebNova</title>
        <link
            rel="stylesheet"
            href="style.css"
        />
    </head>
    <body>
        <header>
            <nav>
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="#">Servicios</a></li>
                    <li><a href="contact.html">Contacto</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <section>
                <h1>Contacto</h1>
                <p>
                    Gracias por tu interés en WebNova. Estamos aquí
                    para ayudarte con cualquier pregunta o
                    preocupación que tengas.
                </p>
                <form action="">
                    <label for="name">Nombre</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                    />
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                    />
                    <label for="message">Mensaje</label>
                    <textarea
                        id="message"
                        name="message"
                        rows="4"
                        cols="50"
                    ></textarea>
                    <button type="submit">Enviar</button>
                </form>
            </section>
        </main>
        <footer>
            <p>&copy; 2025 WebNova. Todos los derechos reservados.</p>
        </footer>
    </body>
</html>
